{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<section class="container narrow-page">
  <p class="eyebrow">Acceso demostrativo</p><h1>Iniciar sesión</h1>
  <p>Utiliza exclusivamente las credenciales ficticias documentadas para este prototipo.</p>
  <form class="panel-form" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Correo</label><input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button" type="submit">Ingresar</button>
  </form>
</section>
{% endblock %}
