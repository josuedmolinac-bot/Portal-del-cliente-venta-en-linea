{% extends "base.html" %}
{% block title %}Mi cuenta{% endblock %}
{% block content %}
<section class="container narrow-page">
  <p class="eyebrow">Cuenta de demostración</p><h1>Mi cuenta</h1>
  <dl class="account-data"><div><dt>Nombre</dt><dd>{{ current_user.name }}</dd></div><div><dt>Correo</dt><dd>{{ current_user.email }}</dd></div></dl>
  <p class="prototype-note">Esta cuenta es ficticia y no representa un registro persistente.</p>
  <div class="account-actions"><a class="button" href="{{ url_for('orders') }}">Consultar pedidos</a><a class="button button--secondary" href="{{ url_for('cart') }}">Ver carrito</a></div>
</section>
{% endblock %}
