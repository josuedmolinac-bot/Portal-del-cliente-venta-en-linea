<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Portal del Cliente{% endblock %} | Seguridad LTDA</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="{{ url_for('home') }}">Seguridad LTDA<span>Portal del Cliente</span></a>
      <nav aria-label="Navegación principal">
        <a href="{{ url_for('home') }}">Inicio</a>
        <a href="{{ url_for('products') }}">Productos</a>
        <span aria-disabled="true">Mis pedidos</span>
        <span aria-disabled="true">Mi cuenta</span>
        <span aria-disabled="true">Iniciar sesión</span>
      </nav>
    </div>
  </header>
  <main id="contenido">{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="container">Seguridad LTDA · Datos demostrativos sin conexión a inventario real</div>
  </footer>
</body>
</html>
